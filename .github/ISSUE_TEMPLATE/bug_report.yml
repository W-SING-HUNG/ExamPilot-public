name: Bug 报告
description: 报告一个缺陷
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        安全问题请勿使用本模板，请见 [SECURITY.md](../blob/main/SECURITY.md)。

  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 清晰说明期望行为与实际行为
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 越具体越好
      placeholder: |
        1. 进入「分章练习」
        2. 选择第一章
        3. 提交答案
        4. 出现 …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      description: 应用版本或 git commit hash
    validations:
      required: true

  - type: dropdown
    id: bank
    attributes:
      label: 使用的题库
      options:
        - 公开示例题库
        - 本地完整题库
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: 浏览器
      options:
        - Chrome
        - Edge
        - Firefox
        - Safari
        - 其他
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: 控制台错误（如有）
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，没有重复
          required: true
        - label: 我未在报告中包含任何密钥或个人学习数据
          required: true
