name: 功能建议
description: 提出一个新功能或改进
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出改进建议。请先确认这个功能有实际价值，而不是增加形式复杂度。

  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 描述当前遇到的困难或低效环节
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案

  - type: dropdown
    id: area
    attributes:
      label: 所属模块
      options:
        - 题库 / 解析
        - 评分引擎
        - 复习调度
        - 统计 / 诊断
        - 模拟考试
        - AI 助手
        - 导入导出
        - UI / 交互
        - 工程化 / CI
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，没有重复
          required: true
        - label: 我理解本项目坚持轻量化，不做没有实际价值的形式工程
          required: true
